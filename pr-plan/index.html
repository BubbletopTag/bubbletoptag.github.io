<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PR Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  /* Layout: one NavigationStack per tab, SwiftUI inset-grouped lists, floating Liquid Glass tab bar */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,Roboto,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --navh:54px; --tabh:62px;
  --tabb:max(12px,calc(var(--sab) - 10px));
  --ease:cubic-bezier(.32,.72,0,1);

  --bg:#F2F2F7; --card:#FFFFFF; --sheet-bg:#F2F2F7; --sheet-card:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --tint:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00;
  --teal:#30B0C7; --indigo:#5856D6; --purple:#AF52DE; --pink:#FF2D55; --gray:#8E8E93; --mint:#00C7BE;
  --glass:rgba(255,255,255,.56); --glass-line:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9);
  --glass-shadow:0 8px 28px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06);
  --thumb:#FFFFFF; --seg-track:rgba(120,120,128,.12); --switch-off:rgba(120,120,128,.16);
  --hero-a:#13B6C9; --hero-b:#0A5FE0; --hero-c:rgba(255,214,120,.55);
  --desk:#D8D8DE;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --sheet-bg:#1C1C1E; --sheet-card:#2C2C2E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
    --tint:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
    --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --pink:#FF375F; --gray:#8E8E93; --mint:#63E6E2;
    --glass:rgba(62,62,68,.48); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
    --glass-shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
    --thumb:#636366; --seg-track:rgba(118,118,128,.24); --switch-off:rgba(120,120,128,.32);
    --hero-a:#0B8DA0; --hero-b:#0A46B8; --hero-c:rgba(255,190,90,.35);
    --desk:#121214;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --sheet-bg:#1C1C1E; --sheet-card:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --tint:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
  --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --pink:#FF375F; --gray:#8E8E93; --mint:#63E6E2;
  --glass:rgba(62,62,68,.48); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
  --glass-shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
  --thumb:#636366; --seg-track:rgba(118,118,128,.24); --switch-off:rgba(120,120,128,.32);
  --hero-a:#0B8DA0; --hero-b:#0A46B8; --hero-c:rgba(255,190,90,.35);
  --desk:#121214;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.294 var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- device shell ---------- */
#device{position:relative;width:100%;height:100%}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#000;isolation:isolate}
#main{position:absolute;inset:0;background:var(--bg);overflow:hidden;transform-origin:50% 0;transition:transform .5s var(--ease),border-radius .5s var(--ease)}
#main::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);z-index:30}
.sheet-open #main{transform:translateY(calc(var(--sat) * .45 + 2px)) scale(.92);border-radius:24px}
.sheet-open #main::after{opacity:.22}
.statusbar,.home-ind{display:none}
@media (min-width:600px) and (min-height:640px){
  body{display:grid;place-items:center;background:var(--desk);overflow:auto}
  #device{width:402px;height:min(874px,calc(100% - 40px));border-radius:64px;padding:12px;background:#0c0c0d;box-shadow:inset 0 0 0 2px #2c2c2e,0 40px 90px -20px rgba(0,0,0,.45);--sat:54px;--sab:30px;--tabb:20px}
  #app{border-radius:52px}
  .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;padding:0 30px 0 44px;align-items:center;justify-content:space-between;z-index:60;pointer-events:none;color:var(--label);font:600 17px var(--font)}
  .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
  .sb-icons{display:flex;gap:6px;align-items:center}
  .sb-icons svg{fill:currentColor}
  .home-ind{display:block;position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--label);opacity:.85;z-index:60;pointer-events:none}
}

/* ---------- navigation stacks ---------- */
.tabview{position:absolute;inset:0;display:none}
.tabview.active{display:block}
.page{position:absolute;inset:0;background:var(--bg);overflow:hidden;transition:transform .5s var(--ease);touch-action:pan-y}
.page.enter{transform:translateX(100%)}
.page.under{transform:translateX(-28%)}
.page::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);z-index:10}
.page.under::after{opacity:.08}
.tabview .page:not(:first-child){box-shadow:-6px 0 24px rgba(0,0,0,.08)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.content{padding:calc(var(--sat) + var(--navh)) 0 calc(var(--tabh) + var(--tabb) + 36px);max-width:640px;margin:0 auto}
.page.inline .content{padding-top:calc(var(--sat) + var(--navh) + 6px)}

.nav{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:var(--sat);height:calc(var(--sat) + var(--navh));pointer-events:none}
.nav::before{content:"";position:absolute;inset:0 0 -22px 0;background:linear-gradient(var(--bg) 35%,color-mix(in srgb,var(--bg) 0%,transparent));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent);opacity:0;transition:opacity .2s}
.page.scrolled .nav::before{opacity:1}
.nav-inner{position:relative;height:var(--navh);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px}
.nav-l,.nav-r{display:flex;gap:8px;pointer-events:auto;z-index:1}
.nav-title{position:absolute;left:76px;right:76px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .18s}
.page.scrolled .nav-title,.page.inline .nav-title{opacity:1}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;padding:0;color:var(--label)}
.gbtn .ic{stroke-width:2.2}
.gbtn:active{transform:scale(.92)}
.gbtn.tinted{background:var(--tint);color:#fff;border-color:transparent}
.gbtn:disabled{opacity:.35;cursor:default}

.eyebrow{padding:4px 20px 0;font-size:13px;font-weight:600;letter-spacing:-.08px;color:var(--label2);text-transform:uppercase}
.lt{margin:0;padding:0 20px 6px;font:700 34px/41px var(--font-display);letter-spacing:.37px;text-wrap:balance}

/* ---------- lists ---------- */
.sec{margin-top:26px}
.sec.tight{margin-top:14px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 32px 7px;font-size:13px;letter-spacing:-.08px;color:var(--label2);text-transform:uppercase}
.sec-h .hbtn{border:0;background:none;color:var(--tint);font-size:15px;text-transform:none;padding:0;font-weight:500;letter-spacing:-.2px}
.sec-f{padding:7px 32px 0;font-size:13px;line-height:1.38;letter-spacing:-.08px;color:var(--label2)}
.sec-f a,.sec-f button.link{color:var(--tint);text-decoration:none;border:0;background:none;padding:0;font-size:inherit}
.group{margin:0 16px;background:var(--card);border-radius:24px;overflow:hidden;position:relative}
.group>*{position:relative}
.group>*:not(:last-child)::after{content:"";position:absolute;left:var(--sl,16px);right:0;bottom:0;height:1px;transform:scaleY(.5);transform-origin:bottom;background:var(--sep);z-index:3;pointer-events:none}
.group>.hi,.group>.swipe.hi{--sl:62px}
.group.pad{padding:16px}
.group.result>*::after,.group.pad>*::after{display:none}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 16px;background:var(--card);text-align:left;width:100%;border:0}
.row.tap{cursor:pointer}
.row.tap:active{background:color-mix(in srgb,var(--card) 80%,var(--label2))}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-size:17px;line-height:22px}
.row-sub{font-size:13px;line-height:17px;letter-spacing:-.08px;color:var(--label2);margin-top:2px}
.row-val{color:var(--label2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row-val.strong{font-weight:600;color:var(--label)}
.row-val.g,.g{color:var(--green)}
.row-val.r,.r{color:var(--red)}
.row-val.two{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.row-val.two b{font-weight:500;color:var(--label)}
.row-val.two span{font-size:13px}
.row-warn{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:13px;color:var(--orange)}
.row-warn .ic{font-size:13px;stroke-width:2.4}
.row.strong .row-title{font-weight:600}
.row.action{justify-content:center;color:var(--tint);font-size:17px}
.row.action.red{color:var(--red)}
.chev{color:var(--label3);font-size:14px;display:grid;place-items:center;margin-left:-2px}
.chev .ic{stroke-width:2.8}
.tile{width:32px;height:32px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.tile .ic{stroke-width:2.1}
.mini-pill{display:inline-block;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint);font-size:11px;font-weight:600;letter-spacing:0;vertical-align:1px}
.mini-pill.now{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.job-tag{font-size:12px;font-weight:600;color:var(--label2);margin-left:4px;letter-spacing:0}

/* ---------- controls ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg-track);border-radius:999px;padding:3px;height:36px;flex:none}
.seg.wide{margin:0 16px}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:14px;font-weight:500;letter-spacing:-.15px;border-radius:999px;padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));transform:translateX(calc(100% * var(--i)));background:var(--thumb);border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .38s var(--ease)}
.seg .thumb.anim-from{transform:translateX(calc(100% * var(--from)));transition:none}
.seg-row{padding:4px 0 2px}
.sw{position:relative;width:51px;height:31px;flex:none;border-radius:999px;background:var(--switch-off);border:0;padding:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .32s var(--ease)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sw.anim-from,.sw.anim-from::after{transition:none}
.sw.anim-from[aria-checked="true"]{background:var(--switch-off)}
.sw.anim-from[aria-checked="true"]::after{transform:none}
.sw.anim-from[aria-checked="false"]{background:var(--green)}
.sw.anim-from[aria-checked="false"]::after{transform:translateX(20px)}
.stepper{display:flex;align-items:stretch;background:var(--fill);border-radius:999px;height:34px;flex:none}
.stepper button{width:44px;border:0;background:none;font-size:22px;line-height:1;display:grid;place-items:center;border-radius:999px}
.stepper button:active{background:var(--fill2)}
.stepper i{width:1px;margin:8px 0;background:var(--sep)}
.pill{position:relative;display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;cursor:pointer}
.pill.empty{color:var(--label2)}
.pill input,.pill select{position:absolute;inset:0;width:100%;height:100%;opacity:.011;font-size:16px;border:0;margin:0;padding:0;-webkit-appearance:none;appearance:none;cursor:pointer;color:transparent;background:transparent}
.pill.menu{color:var(--tint);gap:4px;padding:0 10px 0 12px;max-width:62%}
.pill.menu span{overflow:hidden;text-overflow:ellipsis}
.pill.menu .ic{font-size:13px;stroke-width:2.6}
.fld{display:flex;align-items:center;gap:2px;flex:none;color:var(--label2);font-variant-numeric:tabular-nums}
.fld input{width:86px;border:0;background:transparent;text-align:right;font:17px var(--font);letter-spacing:-.41px;color:var(--label);padding:6px 0;font-variant-numeric:tabular-nums;outline:none}
.fld input:focus{color:var(--tint)}
.fld.sm input{width:44px}
.fld span{font-size:15px}
.textin{width:100%;border:0;background:transparent;font:17px var(--font);letter-spacing:-.41px;color:var(--label);padding:0;outline:none;resize:none;min-height:22px}
.textin::placeholder,.fld input::placeholder{color:var(--label3)}
.calc-val{color:var(--label2)}

/* ---------- plan tab ---------- */
.hero{display:block;width:calc(100% - 32px);margin:8px 16px 0;padding:18px 18px 16px;border:0;border-radius:28px;color:#fff;text-align:left;background:radial-gradient(130% 120% at 100% 0%,var(--hero-c) 0%,transparent 52%),linear-gradient(145deg,var(--hero-a),var(--hero-b));box-shadow:0 14px 34px -14px color-mix(in srgb,var(--hero-b) 70%,transparent);position:relative;overflow:hidden}
.hero:active{transform:scale(.985)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:140px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);box-shadow:0 0 0 18px rgba(255,255,255,.05),0 0 0 40px rgba(255,255,255,.04)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-cap{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1px;opacity:.9}
.hero-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;font-weight:600;letter-spacing:-.08px;white-space:nowrap}
.hero-pill .ic{stroke-width:2.8;font-size:12px}
.hero-num,.hero-sub{display:block}
.hero-num{font:700 50px/1.05 var(--font-round);letter-spacing:-.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:15px;opacity:.92;margin-top:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-chips span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600;letter-spacing:-.05px;white-space:nowrap}
.hero-chips .ic{font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 16px 0}
.tile-card{border:0;background:var(--card);border-radius:20px;padding:12px 12px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-card:active{transform:scale(.97)}
.tile-card .tc-l{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-card .tc-v{font:600 17px/1.2 var(--font-round);letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-card .tc-s{font-size:11px;color:var(--label2);letter-spacing:0;line-height:1.25}
.chart{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr 70px;column-gap:10px;row-gap:4px;align-items:center}
.bar-lab{grid-column:1 / -1;font-size:13px;color:var(--label2);letter-spacing:-.08px;display:flex;align-items:center;gap:6px}
.bar-lab b{font-size:11px;font-weight:600;color:var(--green);letter-spacing:0}
.bar-lab b.mine{color:var(--tint)}
.cta{display:flex;align-items:center;gap:12px;margin:8px 16px 12px;padding:14px 14px 14px 16px;background:var(--card);border-radius:24px}
.cta-ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint);display:grid;place-items:center;font-size:22px;flex:none}
.cta-main{flex:1;min-width:0}
.cta-t{font-size:16px;font-weight:600;letter-spacing:-.3px}
.cta-s{margin-top:2px;font-size:13px;line-height:1.3;color:var(--label2);letter-spacing:-.08px}
.cta .cap-btn{margin:0;flex:none}
.bar-area{position:relative;height:22px;background-image:linear-gradient(to right,var(--sep) 1px,transparent 1px);background-size:calc(100% / var(--k)) 100%;border-right:1px solid var(--sep)}
.bar-area .zero{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--label3)}
.bar{position:absolute;top:2px;bottom:2px;border-radius:6px;opacity:.82}
.bar.best{opacity:1}
.bar.g{background:var(--green)}
.bar.r{background:var(--red)}
.bar-val{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.axis{display:grid;grid-template-columns:1fr 70px;column-gap:10px}
.axis div{position:relative;height:14px;font-size:11px;color:var(--label2);letter-spacing:0}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.sync{display:flex;align-items:center;justify-content:center;gap:7px;padding:22px 32px 0;font-size:13px;color:var(--label2);text-align:center;letter-spacing:-.08px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);flex:none}
.sync-dot.live{background:var(--green)}
.sync-dot.offline,.sync-dot.error,.sync-dot.quota{background:var(--orange)}
.sync-dot.connecting{background:var(--tint);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* result + storage bars */
.result{padding:16px}
.res-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cap{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px}
.res-num{font:700 40px/1.1 var(--font-round);letter-spacing:-.4px;margin-top:4px;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:-.08px;white-space:nowrap}
.status .ic{font-size:13px;stroke-width:2.8}
.status.g{background:color-mix(in srgb,var(--green) 15%,transparent)}
.status.r{background:color-mix(in srgb,var(--red) 13%,transparent)}
.sbar{position:relative;display:flex;gap:2px;height:22px;margin-top:16px;border-radius:7px;overflow:visible}
.sbar>i{display:block;min-width:3px;height:100%}
.sbar>i:first-child{border-radius:7px 0 0 7px}
.sbar>i:last-of-type{border-radius:0 7px 7px 0}
.sbar>i:only-of-type{border-radius:7px}
.sbar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--label);border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--label2);letter-spacing:-.08px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend i.line{width:2px;height:11px;border-radius:1px;background:var(--label)}
.legend em{font-style:normal;color:var(--label);font-variant-numeric:tabular-nums}

/* hours */
.rings{display:grid;grid-template-columns:1fr 1fr;padding:18px 8px 16px}
.group.rings>*::after{display:none}
.ring-cell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.ring-cell+.ring-cell{border-left:.5px solid var(--sep)}
.ring-wrap{position:relative;width:112px;height:112px;margin-bottom:8px}
.ring-wrap svg{display:block}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font:700 26px var(--font-round);font-variant-numeric:tabular-nums}
.ring-pct small{font-size:14px;font-weight:600}
.ring-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.2px}
.ring-main{font:600 20px var(--font-round);font-variant-numeric:tabular-nums}
.ring-main span{font:500 13px var(--font);color:var(--label2);letter-spacing:-.08px}
.ring-sub{font-size:12px;color:var(--label2);letter-spacing:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 24px 22px;gap:6px}
.empty .ic{font-size:40px;color:var(--label3);stroke-width:1.6;margin-bottom:4px}
.empty b{font-size:20px;font-weight:700;letter-spacing:.2px}
.empty span{font-size:15px;color:var(--label2);line-height:1.35;letter-spacing:-.2px}
.cap-btn{margin-top:10px;border:0;border-radius:999px;background:var(--tint);color:#fff;font-weight:600;font-size:15px;padding:9px 18px}
.cap-btn:active{opacity:.8}

/* swipe actions */
.swipe{overflow:hidden;background:var(--card)}
.swipe-acts{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:0}
.sa{border:0;width:78px;color:#fff;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;letter-spacing:-.08px}
.sa .ic{font-size:19px}
.sa.red{background:var(--red)}
.sa.orange{background:var(--orange)}
.swipe-row{position:relative;z-index:1;transition:transform .35s var(--ease);touch-action:pan-y}

/* budget */
.tl-stepper{display:flex;align-items:center;gap:12px}
.vs{display:grid;gap:10px;padding:14px 16px}
.vs-row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--label2);letter-spacing:-.08px}
.vs-bar{height:14px;border-radius:5px}

/* timeline */
.count-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 16px 0}
.count{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.count .num{font:700 34px/1.1 var(--font-round);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.count .num small{font:600 15px var(--font);color:var(--label2);letter-spacing:-.2px;margin-left:3px}
.count .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count .s{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.count.accent .num{color:var(--teal)}
.dblock{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1}
.dblock .dw{font-size:11px;font-weight:700;color:var(--label2);letter-spacing:.3px;text-transform:uppercase}
.dblock .dd{font:600 22px var(--font-round);margin-top:3px;font-variant-numeric:tabular-nums}
.dblock .dd.today{background:var(--red);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:18px;margin-top:2px}
.dblock.season .dd{font-size:15px}
.tl-row.past{opacity:.45}
.type{flex:none;align-self:flex-start;margin-top:2px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:0;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.today-line{display:flex;align-items:center;gap:8px;padding:6px 16px;color:var(--red);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.today-line::after{content:"";flex:1;height:1.5px;background:var(--red);border-radius:1px}
.today-line::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.group>.today-line::after{position:static;transform:none;height:1.5px;left:auto;background:var(--red);z-index:auto}

/* checklist */
.prog-card{display:flex;align-items:center;gap:16px;padding:16px}
.prog-card .pc-main{flex:1;min-width:0}
.prog-card .pc-num{font:700 28px var(--font-round);font-variant-numeric:tabular-nums}
.prog-card .pc-num span{font:500 15px var(--font);color:var(--label2);letter-spacing:-.2px}
.pbar{height:8px;border-radius:4px;background:var(--fill);margin-top:8px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--label3);background:none;flex:none;display:grid;place-items:center;padding:0;color:#fff;font-size:15px;align-self:flex-start;margin-top:-1px}
.circle .ic{opacity:0;stroke-width:3}
.circle.done{background:var(--tint);border-color:var(--tint)}
.circle.done .ic{opacity:1}
.circle.doing{border-color:var(--orange);background:conic-gradient(var(--orange) 0 50%,transparent 50% 100%);background-clip:content-box;padding:3px}
.task.done .row-title{color:var(--label2)}
.task .row-title{font-size:17px;line-height:22px}
.area-h{display:flex;align-items:center;gap:7px}
.area-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ---------- tab bar ---------- */
.tabfade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--tabb) + 34px);background:linear-gradient(to top,var(--bg) 30%,color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none;z-index:15}
.tabbar{position:absolute;left:14px;right:14px;bottom:var(--tabb);height:var(--tabh);border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;z-index:20;max-width:500px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;border-radius:999px;transition:background .25s,color .25s;color:var(--label)}
.tab .ic{font-size:24px;stroke-width:1.9}
.tab[aria-selected="true"]{color:var(--tint);background:var(--fill)}
.tab:active{transform:scale(.94)}

/* ---------- sheets, dialogs, toast ---------- */
#sheet-layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.sheet-scrim{position:absolute;inset:0;pointer-events:auto}
.sheet{--bg:var(--sheet-bg);--card:var(--sheet-card);position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 10px);background:var(--bg);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);pointer-events:auto;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.14);overflow:hidden;max-width:640px;margin:0 auto}
.sheet-open .sheet{transform:none}
.sheet.dragging{transition:none}
.sheet-nav{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;touch-action:none}
.grabber{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.sheet-title{position:absolute;left:76px;right:76px;text-align:center;font-weight:600;pointer-events:none}
.sn-l,.sn-r{display:flex;z-index:1}
.sheet.wiz .sheet-scroll{padding-bottom:20px}
.wiz-anim{animation:wizIn .38s var(--ease)}
@keyframes wizIn{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.wiz-prog{display:flex;gap:6px;margin:2px 24px 18px}
.wiz-prog i{flex:1;height:4px;border-radius:2px;background:var(--fill2)}
.wiz-prog i.on{background:var(--tint)}
.wiz-head{padding:0 24px}
.wiz-step{font-size:13px;font-weight:600;color:var(--tint);text-transform:uppercase;letter-spacing:.1px}
.wiz-title{margin:4px 0 6px;font:700 28px/34px var(--font-display);letter-spacing:.36px;text-wrap:balance}
.wiz-sub{margin:0;font-size:15px;line-height:1.35;color:var(--label2);letter-spacing:-.2px}
.wiz-note{margin:14px 32px 0;font-size:13px;line-height:1.38;color:var(--label2);letter-spacing:-.08px}
.choices{display:grid;gap:12px;margin:22px 16px 0}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:2px solid transparent;background:var(--card);border-radius:24px;padding:16px;transition:border-color .2s,transform .15s}
.choice:active{transform:scale(.985)}
.choice[aria-checked="true"]{border-color:var(--tint)}
.ch-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ch-t{font-size:17px;font-weight:600;letter-spacing:-.4px}
.ch-s{margin-top:3px;font-size:14px;line-height:1.35;color:var(--label2);letter-spacing:-.15px}
.ch-m{margin-top:10px;font:700 17px var(--font-round);font-variant-numeric:tabular-nums}
.ch-m span{font:500 13px var(--font);color:var(--label2);letter-spacing:-.08px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;margin-top:4px;transition:background .2s,border-color .2s}
.radio .ic{opacity:0;stroke-width:3.2}
.choice[aria-checked="true"] .radio{background:var(--tint);border-color:var(--tint)}
.choice[aria-checked="true"] .radio .ic{opacity:1}
.wiz-foot{flex:none;padding:12px 16px calc(var(--sab) + 14px);border-top:.5px solid var(--sep);background:var(--bg)}
.wiz-live{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 6px 10px;font-size:15px;color:var(--label2);letter-spacing:-.2px}
.wiz-live b{font:700 17px var(--font-round);font-variant-numeric:tabular-nums}
.wiz-btn{display:block;width:100%;height:52px;border:0;border-radius:999px;background:var(--tint);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.4px}
.wiz-btn:active{opacity:.85}
.wiz-btn:disabled{opacity:.35;cursor:default}
.sheet-scroll{flex:1;overflow-y:auto;padding:4px 0 calc(var(--sab) + 32px);overscroll-behavior:contain}
.sheet .sec:first-child{margin-top:8px}
#overlay{position:absolute;inset:0;z-index:70;pointer-events:none}
#overlay.show{pointer-events:auto}
.dlg-scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .3s}
.show .dlg-scrim{opacity:1}
.dlg-box{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 10px);display:grid;gap:8px;transform:translateY(120%);transition:transform .45s var(--ease);max-width:480px;margin:0 auto}
.show .dlg-box{transform:none}
.dlg{border-radius:26px;overflow:hidden;background:var(--card)}
.dlg-msg{padding:16px 20px 14px;text-align:center;display:grid;gap:4px;font-size:13px;color:var(--label2);letter-spacing:-.08px;border-bottom:.5px solid var(--sep)}
.dlg-msg b{font-size:15px;color:var(--label);letter-spacing:-.2px}
.dlg-btn{display:block;width:100%;border:0;background:none;height:56px;font-size:19px;color:var(--tint)}
.dlg-btn.red{color:var(--red)}
.dlg-btn.bold{font-weight:600}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,-140%);z-index:80;border-radius:999px;padding:9px 10px 9px 18px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .45s var(--ease);max-width:calc(100% - 32px)}
#toast.show{transform:translate(-50%,0)}
#toast button{border:0;background:var(--fill);color:var(--tint);font-weight:600;font-size:14px;border-radius:999px;padding:5px 12px}
#toast span:last-child{padding-right:8px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01s!important;animation:none!important}
}

/* ---------- Liquid Glass pass ---------- */
*{-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,.row.tap,.choice{touch-action:manipulation}
.glass{border:0;-webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(1.05);backdrop-filter:blur(16px) saturate(1.9) brightness(1.05);box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-line),inset 0 1.5px 1px -.5px var(--glass-hi),inset 0 -1.5px 2px -1px rgba(0,0,0,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--glass-hi) 0%,transparent 32%,transparent 68%,var(--glass-hi) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.gbtn,.dlg{position:relative}
.gbtn{transition:transform .4s cubic-bezier(.3,1.7,.5,1),background .2s}
.gbtn:active{transform:scale(1.14)}
.gbtn.tinted{box-shadow:0 6px 18px -4px color-mix(in srgb,var(--tint) 60%,transparent),inset 0 1.5px 1px -.5px rgba(255,255,255,.55)}
.cap-btn,.wiz-btn{transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;box-shadow:inset 0 1.5px 1px -.5px rgba(255,255,255,.45)}
.cap-btn:active,.wiz-btn:active{transform:scale(.97)}
.hero,.tile-card,.choice{transition:transform .35s cubic-bezier(.3,1.5,.5,1),border-color .2s}
.hero{box-shadow:0 14px 34px -14px color-mix(in srgb,var(--hero-b) 70%,transparent),inset 0 1.5px 1px -.5px rgba(255,255,255,.5),inset 0 0 0 .5px rgba(255,255,255,.18)}
.hero::after{display:none}
.hero-pr{position:absolute;right:-22px;bottom:34px;width:236px;height:auto;fill:#fff;opacity:.13;pointer-events:none}
.hero-pill,.hero-chips span{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.2)}
.tabbar{--ti:0;transition:height .45s var(--ease),left .45s var(--ease),right .45s var(--ease)}
.tab{position:relative;z-index:1;transition:color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-selected="true"]{background:none}
.tab span{transition:opacity .2s}
.lens{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:999px;background:var(--fill);box-shadow:inset 0 1.5px 1px -.5px var(--glass-hi),inset 0 0 0 .5px var(--glass-line),0 2px 8px rgba(0,0,0,.06);transform:translateX(calc(100% * var(--ti)));transition:transform .55s cubic-bezier(.3,1.3,.5,1),scale .26s var(--ease)}
.lens.moving{scale:1.1 1.07}
.tab-min .tabbar{height:48px;left:58px;right:58px}
.tab-min .tab span{position:absolute;opacity:0}
.tab-min .tab .ic{font-size:22px}
.sw{width:64px;height:28px}
.sw::after{width:39px;height:24px;border-radius:12px;transition:transform .38s cubic-bezier(.3,1.3,.5,1),scale .2s}
.sw:active::after{scale:1.1 1.18}
.sw[aria-checked="true"]::after,.sw.anim-from[aria-checked="false"]::after{transform:translateX(21px)}
.sw.anim-from[aria-checked="true"]::after{transform:none}
.seg .thumb{box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04),inset 0 1px 0 var(--glass-hi)}
.stepper button{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.stepper button:active{transform:scale(1.15)}
.sheet{border-radius:38px 38px 0 0}
.circle{transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s,border-color .2s}
.circle:active{transform:scale(1.2)}
</style>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
var DAY=86400000;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

function clone(o){return JSON.parse(JSON.stringify(o))}

function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function isTime(s){return typeof s==='string'&&/^\d{2}:\d{2}$/.test(s)}

function n2d(n){return new Date(n*DAY).toISOString().slice(0,10)}
function todayN(){var t=new Date();return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY)}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtD(n,st){

  if(st==='wmd')return WD[w]+', '+MON[m]+' '+dd;
  if(st==='mdy')return MON[m]+' '+dd+', '+y;
  if(st==='wmdy')return WD[w]+', '+MON[m]+' '+dd+', '+y;
  return MON[m]+' '+dd;
}

function sanScenario(s,d){

    first:isDate(s.first)?s.first:d.first,last:isDate(s.last)?s.last:d.last,depart:isDate(s.depart)?s.depart:d.depart,
    caf:isFinite(+s.caf)&&s.caf!==null&&s.caf!==''?+s.caf:d.caf,flyHome:typeof s.flyHome==='boolean'?s.flyHome:d.flyHome,payDebt:typeof s.payDebt==='boolean'?s.payDebt:d.payDebt};
}
function mergeNums(def,src){
  var o={};Object.keys(def).forEach(function(k){
    var v=src&&src[k];
    if(def[k]===null||typeof def[k]==='number'){o[k]=(v===null&&def[k]===null)?null:(v!==undefined&&v!==null&&v!==''&&isFinite(+v)?+v:def[k])}
    else if(typeof def[k]==='string'){o[k]=(typeof v==='string'&&(isDate(def[k])?isDate(v):true))?v:def[k]}
    else o[k]=def[k];
  });return o;
}
function applyDoc(k,data){
  data=data||{};
  if(k==='settings'){
    S.inputs=mergeNums(DEF.inputs,data.inputs);
    var sc=Array.isArray(data.scenarios)?data.scenarios:[];
    S.scenarios=DEF.scenarios.map(function(d,i){return sanScenario(sc[i],d)});
    var r=data.rules||{};
    S.rules={track:[0,1,2,3].indexOf(+r.track)>=0?+r.track:0,cafFrom:isDate(r.cafFrom)?r.cafFrom:DEF.rules.cafFrom,
      caf:mergeNums(DEF.rules.caf,r.caf),wm:mergeNums(DEF.rules.wm,r.wm),ar:mergeNums(DEF.rules.ar,r.ar)};
    var pl=data.plan;
    S.plan=pl&&typeof pl==='object'&&(pl.job==='Walmart'||pl.job==='Ariel')&&isDate(pl.depart)?sanScenario(pl,DEF.scenarios[0]):null;
    if(S.plan&&isDate(pl.setAt))S.plan.setAt=pl.setAt;
  }else if(k==='shifts'){
    S.shifts=(Array.isArray(data.items)?data.items:[]).filter(function(s){return s&&isDate(s.date)&&isTime(s.clockIn)&&isTime(s.clockOut)}).map(function(s){

function trip(){
  var i=S.inputs,m=months();
  var monthly=[
    {k:'airbnb',name:'Airbnb',icon:'house',c:'--red',note:'Book month 1; extend only if you land a job'},
    {k:'groceries',name:'Groceries & food',icon:'cart',c:'--green',note:'Cooking at home is the biggest lever here'},

  ].map(function(o){o.per=num(i[o.k]);o.total=o.per*m;return o});
  var once=[
    {k:'flight',name:'Round-trip flight',icon:'plane',c:'--orange',note:'CMH ↔ SJU'},
    {k:'cushion',name:'Return cushion',icon:'lifebuoy',c:'--teal',note:'Waiting for you back home'},
    {k:'mom',name:'Other one-time cost',icon:'gift',c:'--pink',note:''}
  ].map(function(o){o.total=num(i[o.k]);return o});
  var total=monthly.concat(once).reduce(function(a,b){return a+b.total},0);
  var col=monthly.reduce(function(a,b){return a+b.per},0);
  return {m:m,monthly:monthly,once:once,total:total,col:col,prTH:num(i.prTH),perMonthLeft:num(i.prTH)-col};
}
function calcScenario(s,idx){
  var i=S.inputs,first=d2n(s.first),last=d2n(s.last),dep=d2n(s.depart);
  var weeks=(last-first+1)/7;
  var hours=s.job==='Walmart'?weeks*num(i.wmHrs)-num(i.wmHoliday):weeks*num(i.arHrs)-num(i.arMissed)*num(i.arLost);
  var mainTH=s.job==='Walmart'?hours*num(i.wmTH):hours*num(i.arRate)*num(i.arPct)+weeks*num(i.arOT)*num(i.arOTRate)*num(i.arPct);
  var cafTH=num(s.caf)*num(i.cafTH);
  var sv=savings(),before=sv+mainTH+cafTH,buffer=-before*num(i.buffer),atDep=before+buffer;
  var tr=trip().total,xf=s.flyHome?num(i.extraFlight):0,debt=s.payDebt?num(i.debt):0,out=tr+xf+debt,left=atDep-out;
  return {i:idx,job:s.job,dep:dep,caf:num(s.caf),label:s.job+' · '+fmtD(dep,'md'),weeks:weeks,hours:hours,mainTH:mainTH,cafTH:cafTH,
    savings:sv,before:before,buffer:buffer,atDep:atDep,trip:tr,extraFlight:xf,debtPay:debt,out:out,left:left,
    status:left>=0?(s.payDebt?'Debt-free + cushion':'Trip funded'):'Short '+money(-left,0),
    debtLeft:num(i.debt)-debt,backHome:dep+num(i.weeks)*7};
}

function thr(r){return num(r.rate)*(1-withheld(r))}
function hm(s){if(!isTime(s))return 0;var p=s.split(':').map(Number);return (p[0]*60+p[1])/1440}
function mround(x,m){return m?Math.round(x/m)*m:x}
function mod1(x){return ((x%1)+1)%1}
function r4(x){return Math.round(x*1e4)/1e4}
function computeShifts(list){
  var base=list.map(function(sh){
    var r=rule(sh.job),rm=num(r.round)/1440,d=d2n(sh.date);
    var span=r4(mod1(mround(hm(sh.clockOut),rm)-mround(hm(sh.clockIn),rm))*24);
    var meal=(sh.mealOut&&sh.mealIn)?r4(mod1(mround(hm(sh.mealIn),rm)-mround(hm(sh.mealOut),rm))*24):0;
    var brk=(meal===0&&span>=num(r.brkMin))?num(r.brk):0;
    var paid=Math.max(0,span-meal-brk);
    var b=d2n(r.base),len=num(r.len)||14;
    return {id:sh.id,sh:sh,r:r,d:d,span:span,meal:meal,brk:brk,paid:paid,week:b+7*Math.floor((d-b)/7),period:b+len*Math.floor((d-b)/len),key:d+hm(sh.clockIn)};
  });
  base.forEach(function(c){
    var tot=0;base.forEach(function(o){if(o.sh.job===c.sh.job&&o.week===c.week&&o.key<=c.key)tot+=o.paid});
    c.weekTotal=tot;
    c.ot=Math.max(0,Math.min(c.paid,tot-num(c.r.otAfter)));
    var bAt=num(c.r.bonusAt),bH=num(c.r.bonus);
    c.bonus=(bH>0&&bAt>0&&tot>=bAt&&tot-c.paid<bAt)?bH:0;
    c.paidAll=c.paid+c.bonus;
    c.gross=num(c.r.rate)*(c.paid-c.ot+num(c.r.otMult)*c.ot+c.bonus);
    c.th=c.gross*(1-withheld(c.r));
    c.check=c.span>16?'Over 16 hrs: check AM/PM'
      :(c.r.flagMeal&&c.meal===0&&c.span>=num(c.r.brkMin))?'No meal punch on a '+hrs(c.r.brkMin)+'+ hr shift?'
      :(c.ot>0&&c.sh.job==='Caf')?'Caf overtime: keep it under 40'
      :c.ot>0?'Overtime in this shift':'';
  });
  return base;
}
function activePlan(){if(S.plan)return {s:S.plan,idx:-1,chosen:true};var i=S.rules.track||0;return {s:S.scenarios[i]||S.scenarios[0],idx:i,chosen:false}}
function tracker(){
  var ap=activePlan(),sc=ap.s,c=calcScenario(sc,ap.idx),t=todayN(),calcs=computeShifts(S.shifts),main=sc.job;
  var jobs={Caf:{from:d2n(S.rules.cafFrom),through:d2n(sc.depart)-1,planned:num(sc.caf),r:rule('Caf'),planRate:planRate('Caf')}};
  jobs[main]={from:d2n(sc.first),through:d2n(sc.last),planned:c.hours,r:rule(main),planRate:planRate(main)};
  Object.keys(jobs).forEach(function(job){
    var o=jobs[job];o.logged=0;o.th=0;o.weekHrs=0;
    var b=d2n(o.r.base);o.weekStart=b+7*Math.floor((t-b)/7);
    calcs.forEach(function(x){
      if(x.sh.job!==job)return;
      if(x.d>=o.from&&x.d<=o.through){o.logged+=x.paidAll;o.th+=x.th}
      if(x.week===o.weekStart)o.weekHrs+=x.paid;
    });
    o.vsPlan=o.th-o.logged*o.planRate;
    o.untilOT=Math.max(0,num(o.r.otAfter)-o.weekHrs);
  });
  var extra=S.extra.reduce(function(a,e){return a+num(e.amount)},0);
  var cafThr=thr(jobs.Caf.r),mainThr=thr(jobs[main].r);
  var extraCaf=Math.max(0,jobs.Caf.logged-jobs.Caf.planned);
  var covered=mainThr>0?(extraCaf*cafThr+extra)/mainThr:0;
  jobs.Caf.left=Math.max(0,jobs.Caf.planned-jobs.Caf.logged);
  jobs[main].left=Math.max(0,jobs[main].planned-jobs[main].logged-covered);
  jobs.Caf.prog=jobs.Caf.planned>0?Math.min(1,jobs.Caf.logged/jobs.Caf.planned):0;
  jobs[main].prog=jobs[main].planned>0?Math.min(1,(jobs[main].logged+covered)/jobs[main].planned):0;
  Object.keys(jobs).forEach(function(job){var o=jobs[job];o.perWeek=o.left===0?0:o.left/Math.max(1,(o.through-Math.max(t,o.from)+1)/7)});
  return {chosen:ap.chosen,idx:ap.idx,sc:sc,c:c,main:main,jobs:jobs,extra:extra,extraCaf:extraCaf,covered:covered,calcs:calcs,cafThr:cafThr,mainThr:mainThr,today:t};
}
function periodList(job,T){
  var o=T.jobs[job],r=o.r,b=d2n(r.base),len=num(r.len)||14,start=b+len*Math.floor((o.from-b)/len),rows=[];
  for(var k=0;k<8;k++){
    var s=start+len*k,e=s+len-1,row={s:s,e:e,pay:(r.payday===null||r.payday===undefined||r.payday==='')?null:e+num(r.payday),h:0,ot:0,gross:0,th:0,n:0,now:T.today>=s&&T.today<=e};
    T.calcs.forEach(function(x){if(x.sh.job===job&&x.period===s){row.h+=x.paidAll;row.ot+=x.ot;row.gross+=x.gross;row.th+=x.th;row.n++}});
    rows.push(row);
  }
  return rows;
}
function needsFly(dep){return d2n(dep)<=d2n('2027-02-10')}
function defaultWindow(job,depart){
  var m=S.scenarios.concat(DEF.scenarios).filter(function(s){return s.job===job&&s.depart===depart})[0];
  if(m)return {first:m.first,last:m.last};
  var dn=d2n(depart),last=dn-2;
  if(job==='Ariel'){while(wday(last)!==0)last--}

function timelineItems(){
  var P=S.plan,dep=P?d2n(P.depart):d2n('2027-02-11'),out=[];
  TIMELINE.forEach(function(x){
    var n,title=x[1],why=x[2];
    if(x[0]==='+42')n=dep+42;else if(x[0]==='+trial')n=dep+num(S.inputs.weeks)*7;else if(x[0]==='summer')n=null;else n=d2n(x[0]);
    if(P){
      if(title.indexOf('Early option')===0)return;
      if(title.indexOf('Fly to San Juan')===0){n=dep;why='Your plan: the trial run starts'}
      if(title.indexOf('Target start')===0){n=d2n(P.first);title='Start at '+P.job;why='First week of work. Caf is open again too. Grab every shift'}

  return out.sort(function(a,b){return (a.n===null?1e9:a.n)-(b.n===null?1e9:b.n)});
}

var LS='pr-plan-v1',LSUI='pr-plan-ui';
var DOCS={settings:'plan/settings',shifts:'plan/shifts',extra:'plan/extra',tasks:'plan/checklist'};
var db=null,readOnly=false,sync={state:'connecting',at:0},W={},lastSent={},lastSeen={},preDb={},loaded={};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({settings:docBody('settings'),shifts:docBody('shifts'),extra:docBody('extra'),tasks:docBody('tasks')}))}catch(e){}}
function loadLocal(){try{var raw=localStorage.getItem(LS);if(!raw)return;var o=JSON.parse(raw);Object.keys(DOCS).forEach(function(k){if(o&&o[k])applyDoc(k,o[k])})}catch(e){}
  try{var u=JSON.parse(localStorage.getItem(LSUI)||'{}');if(u&&TABS.indexOf(u.tab)>=0)curTab=u.tab}catch(e){}}
function saveUI(){try{localStorage.setItem(LSUI,JSON.stringify({tab:curTab}))}catch(e){}}
function syncText(){
  var st=sync.state,txt={
    connecting:'Connecting to your saved data…',
    live:sync.at?'Saved · synced '+(Date.now()-sync.at<60000?'just now':'at '+new Date(sync.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})):'Synced across your devices',
    local:'Saved in this browser only',
    offline:"Can't reach your saved data right now. Showing what's on this device.",
    readonly:"View only. Only the plan's owner can change it.",
    quota:'Storage is full. Delete old shifts to keep saving.',
    error:"Couldn't save the last change. It's kept on this device for now."}[st]||'';
  return '<span class="sync-dot '+st+'"></span><span>'+esc(txt)+'</span>';
}
function setSync(st){sync.state=st;$$('[data-sync]').forEach(function(el){el.innerHTML=syncText()})}
function touch(k){
  saveLocal();
  if(readOnly){toast("View only: this change won't be saved");return}
  if(!db){preDb[k]=true;return}
  var w=W[k]||(W[k]={timer:0,inflight:false,dirty:false});
  clearTimeout(w.timer);
  w.timer=setTimeout(function(){w.timer=0;flush(k)},600);
}
function flush(k,retried){
  var w=W[k]||(W[k]={timer:0,inflight:false,dirty:false});
  if(w.inflight){w.dirty=true;return}
  w.inflight=true;
  var body=clone(docBody(k));lastSent[k]=JSON.stringify(body);
  db.doc(DOCS[k]).set(body).then(function(){
    sync.at=Date.now();setSync('live');done();
  },function(e){
    var code=e&&e.code;
    if(code==='invalid_argument'||code==='not_granted'){readOnly=true;setSync('readonly')}
    else if(code==='quota_exceeded'){setSync('quota')}
    else if(!retried&&code!=='revoked'){w.inflight=false;setTimeout(function(){flush(k,true)},600+Math.random()*900);return}
    else setSync(code==='revoked'?'local':'error');
    done();
  });
  function done(){w.inflight=false;if(w.dirty){w.dirty=false;flush(k)}}
}
function connect(tries){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){
    if((tries||0)<12){setTimeout(function(){connect((tries||0)+1)},250);return}
    setSync('local');maybeWizard();return;
  }
  Promise.resolve().then(function(){return c.use('db')}).then(function(d){
    if(!d){setSync('local');maybeWizard();return}
    db=d;setSync('connecting');
    var timer=setTimeout(function(){if(Object.keys(DOCS).some(function(k){return !loaded[k]})){setSync('offline');maybeWizard()}},10000);
    function check(){if(Object.keys(DOCS).every(function(k){return loaded[k]})){clearTimeout(timer);if(sync.state==='connecting'||sync.state==='offline')setSync('live');maybeWizard()}}
    Object.keys(DOCS).forEach(function(k){
      try{
        db.doc(DOCS[k]).onSnapshot(function(snap){
          var md=snap.metadata||{};
          if(!md.fromCache){loaded[k]=true;check()}
          if(preDb[k]){if(!md.fromCache){delete preDb[k];flush(k)}return}
          if(!snap.exists||md.hasPendingWrites)return;
          var w=W[k];if(w&&(w.timer||w.inflight))return;
          var data=snap.data(),str=JSON.stringify(data);
          if(str===lastSent[k]||str===lastSeen[k])return;
          lastSeen[k]=str;applyDoc(k,clone(data));saveLocal();requestRender();
        },function(err){loaded[k]=true;clearTimeout(timer);setSync(err&&err.code==='revoked'?'local':'offline')});
      }catch(e){setSync('local')}
    });
  },function(){setSync('local');maybeWizard()});
}

function chev(){return '<span class="chev">'+svg('chevR')+'</span>'}
function tileIcon(icon,color){return '<span class="tile" style="--c:var('+color+')">'+svg(icon)+'</span>'}

function fid(p){return 'f-'+p.replace(/[^\w]/g,'-')}
function numField(path,unit,opt){
  opt=opt||{};var v=getAny(path),kind=unit==='%'?'pct':(opt.nullable?'numn':'num');

function seg(path,opts,cur,cls){
  var i=Math.max(0,opts.findIndex(function(o){return o[0]===cur})),from=animKey===path&&animFrom!==null?animFrom:null;
  return '<div class="seg'+(cls?' '+cls:'')+'" role="group" style="--n:'+opts.length+';--i:'+i+(from!==null?';--from:'+from:'')+'"><span class="thumb'+(from!==null?' anim-from':'')+'"></span>'+

function ring(p,color,size,w){
  size=size||112;w=w||14;var r=(size-w)/2,C=2*Math.PI*r,c=size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" style="stroke:var('+color+');opacity:.2" stroke-width="'+w+'"/>'+
    (p>0?'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" style="stroke:var('+color+')" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+(C*Math.min(1,p)).toFixed(2)+' '+C.toFixed(2)+'" transform="rotate(-90 '+c+' '+c+')"/>':'')+'</svg>';
}
function stackBar(segs,total,marker,markerLabel){
  segs=segs.filter(function(s){return s.v>0});
  var sum=segs.reduce(function(a,s){return a+s.v},0);total=Math.max(total,sum,1);
  var bars=segs.map(function(s){return '<i style="flex:'+(s.v/total).toFixed(5)+' 1 0;background:var('+s.c+')"></i>'}).join('')+(total-sum>0.5?'<i style="flex:'+((total-sum)/total).toFixed(5)+' 1 0;background:var(--fill)"></i>':'');
  return '<div class="sbar">'+bars+(marker!=null?'<b class="mark" style="left:'+(Math.min(1,Math.max(0,marker))*100).toFixed(2)+'%"></b>':'')+'</div>'+
    '<div class="legend">'+segs.map(function(s){return '<span><i style="background:var('+s.c+')"></i>'+s.l+' <em>'+money(s.v,0)+'</em></span>'}).join('')+(markerLabel?'<span><i class="line"></i>'+markerLabel+'</span>':'')+'</div>';
}
function niceStep(raw){if(!(raw>0))return 100;var p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function kfmt(v){var a=Math.abs(v),s=a>=1000?(+(a/1000).toFixed(1))+'k':String(Math.round(a));return (v<0?'−':'')+'$'+s}

function dueLabel(x){
  if(!isDate(x.due))return '';
  var n=d2n(x.due),diff=n-todayN(),hot=function(s){return '<span style="color:var(--orange);font-weight:600">'+s+'</span>'};

  if(diff<0)return '<span class="r" style="font-weight:600">Overdue · '+fmtD(n,'md')+'</span>';
  if(diff===0)return hot('Due today');

/* ================= navigation ================= */
var TABS=['plan','hours','budget','timeline','checklist'];
var TAB_META={plan:['Plan','plan'],hours:['Hours','hours'],budget:['Budget','budget'],timeline:['Timeline','timeline'],checklist:['Checklist','checklist']};
var curTab='plan',stacks={},pendingRender=false;
var app=$('#app');
function makePage(entry){
  var el=document.createElement('div');el.className='page';
  el.innerHTML='<header class="nav"><div class="nav-inner"><div class="nav-l"></div><div class="nav-title"></div><div class="nav-r"></div></div></header><div class="scroll"><div class="content"></div></div>';
  entry.el=el;
  var lastY=0;
  el.querySelector('.scroll').addEventListener('scroll',function(e){
    var s=e.target,y=s.scrollTop,m=$('#main');
    el.classList.toggle('scrolled',y>(entry.large?38:2));
    if(y<40||y-lastY<-8||y+s.clientHeight>s.scrollHeight-30)m.classList.remove('tab-min');
    else if(y-lastY>8)m.classList.add('tab-min');
    if(Math.abs(y-lastY)>8)lastY=y;
  },{passive:true});
  return el;
}
function renderEntry(entry,stack){
  var v=VIEWS[entry.v](entry),el=entry.el,depth=stack.indexOf(entry);
  entry.large=!!v.large;
  el.classList.toggle('inline',!v.large);
  el.querySelector('.nav-l').innerHTML=depth>0?gbtn('chevL','back','','Back'):(v.left||'');
  el.querySelector('.nav-title').textContent=v.title;
  el.querySelector('.nav-r').innerHTML=v.right||'';
  el.querySelector('.content').innerHTML=(v.large?(v.eyebrow?'<div class="eyebrow">'+esc(v.eyebrow)+'</div>':'')+'<h1 class="lt">'+esc(v.title)+'</h1>':'')+v.body;
}
function isEditing(){var a=document.activeElement;return !!(a&&app.contains(a)&&((a.tagName==='INPUT'&&['date','time','checkbox'].indexOf(a.type)<0)||a.tagName==='TEXTAREA'))}
function render(){
  var st=stacks[curTab];renderEntry(st[st.length-1],st);
  afterRender();
}
function requestRender(){if(isEditing()){pendingRender=true;return}pendingRender=false;render()}
function afterRender(){
  var els=$$('.anim-from',app);
  if(els.length){void app.offsetWidth;requestAnimationFrame(function(){requestAnimationFrame(function(){els.forEach(function(el){el.classList.remove('anim-from')})})})}
  animKey=null;animFrom=null;
}
function buildTabbar(){
  var tb=$('#tabbar');tb.style.setProperty('--ti',TABS.indexOf(curTab));tb.innerHTML='<span class="lens"></span>'+TABS.map(function(t){return '<button type="button" class="tab" role="tab" data-act="tab" data-tab="'+t+'" aria-selected="'+(t===curTab)+'">'+svg(TAB_META[t][1])+'<span>'+TAB_META[t][0]+'</span></button>'}).join('');
}
function switchTab(t){
  if(t===curTab){
    var st=stacks[t];
    if(st.length>1){while(st.length>2){var x=st.splice(1,1)[0];x.el.remove()}pop()}
    else{var sc=st[0].el.querySelector('.scroll');sc.scrollTo({top:0,behavior:'smooth'})}
    return;
  }
  curTab=t;saveUI();
  var tb=$('#tabbar'),ln=$('.lens',tb);tb.style.setProperty('--ti',TABS.indexOf(t));if(ln){ln.classList.add('moving');setTimeout(function(){ln.classList.remove('moving')},260)}
  $('#main').classList.remove('tab-min');
  $$('.tabview').forEach(function(v){v.classList.toggle('active',v.dataset.tab===t)});
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t))});
  render();
}
function push(view,params){
  var st=stacks[curTab],prev=st[st.length-1],entry=Object.assign({v:view},params||{});
  var el=makePage(entry);el.classList.add('enter');
  $('.tabview[data-tab="'+curTab+'"]').appendChild(el);
  st.push(entry);render();
  void el.offsetWidth;
  requestAnimationFrame(function(){el.classList.remove('enter');prev.el.classList.add('under')});
}
function pop(){
  var st=stacks[curTab];if(st.length<2)return;
  var top=st.pop(),prev=st[st.length-1];
  renderEntry(prev,st);afterRender();
  top.el.style.transform='';prev.el.style.transform='';top.el.style.transition='';prev.el.style.transition='';
  top.el.classList.add('enter');prev.el.classList.remove('under');
  setTimeout(function(){top.el.remove()},520);
}

/* ================= state writes from controls ================= */
function getAny(p){return p.indexOf('draft.')===0?getPath(sheet.draft,p.slice(6)):p.indexOf('ui.')===0?getPath(UI,p.slice(3)):getPath(S,p)}
function hookDraft(p){var K=sheet&&SHEETS[sheet.kind];if(K&&K.hook)K.hook(sheet.draft,p)}
function setAny(p,v){
  if(p.indexOf('draft.')===0){setPath(sheet.draft,p.slice(6),v);hookDraft(p.slice(6));renderSheet();return}
  if(p.indexOf('ui.')===0){setPath(UI,p.slice(3),v);render();return}
  setPath(S,p,v);touch(docOf(p));render();
}
function readVal(t){
  var k=t.dataset.kind,raw=t.value,s;
  if(k==='num'||k==='numn'||k==='pct'){
    s=String(raw).replace(/[$,%\s]/g,'');
    if(s==='')return k==='numn'?null:undefined;
    var n=parseFloat(s);if(!isFinite(n))return undefined;
    return k==='pct'?+(n/100).toFixed(8):n;
  }
  if(k==='int'){var x=parseInt(raw,10);return isFinite(x)?x:undefined}
  if(k==='date')return isDate(raw)?raw:undefined;
  if(k==='time')return isTime(raw)?raw:undefined;
  return raw;
}
function onBind(t,commit){
  var p=t.dataset.bind,v=readVal(t);
  if(v===undefined){if(commit&&p.indexOf('draft.')!==0)requestRender();return}
  if(p.indexOf('draft.')===0){
    setPath(sheet.draft,p.slice(6),v);
    if(commit&&(['date','time','int'].indexOf(t.dataset.kind)>=0||t.tagName==='SELECT')){hookDraft(p.slice(6));renderSheet()}else updateSheetChrome();
    return;
  }
  if(p.indexOf('ui.')===0){setPath(UI,p.slice(3),v);render();return}
  var prev=getPath(S,p);
  if(prev!==v){setPath(S,p,v);touch(docOf(p))}
  if(commit)requestRender();
}

});

var sw=null,edge=null,sd=null;

  if(e.button!==undefined&&e.button!==0)return;
  var row=e.target.closest('.swipe-row');
  if(row&&!e.target.closest('.circle')){var acts=row.parentElement.querySelector('.swipe-acts');sw={row:row,x:e.clientX,y:e.clientY,dx:0,base:row.classList.contains('open')?-acts.offsetWidth:0,w:acts.offsetWidth,active:false}}
  var st=stacks[curTab],r=app.getBoundingClientRect();
  if(!sheet&&st&&st.length>1&&e.clientX-r.left<26)edge={x:e.clientX,y:e.clientY,w:r.width,active:false,t:Date.now()};
  var nav=e.target.closest('.sheet-nav');
  if(nav&&!e.target.closest('button'))sd={y:e.clientY,dy:0,el:nav.parentElement};
});
app.addEventListener('pointermove',function(e){
  if(edge){
    var dx=e.clientX-edge.x,dy=e.clientY-edge.y,st=stacks[curTab];
    if(!edge.active){if(dx>10&&dx>Math.abs(dy)){edge.active=true;sw=null;st[st.length-1].el.style.transition='none';st[st.length-2].el.style.transition='none'}else if(Math.abs(dy)>10){edge=null}}
    if(edge&&edge.active){var p=Math.max(0,dx)/edge.w;edge.dx=dx;st[st.length-1].el.style.transform='translateX('+Math.max(0,dx)+'px)';st[st.length-2].el.style.transform='translateX('+(-28+28*p)+'%)';return}
  }
  if(sw){
    var dx2=e.clientX-sw.x,dy2=e.clientY-sw.y;
    if(!sw.active){if(Math.abs(dx2)>8&&Math.abs(dx2)>Math.abs(dy2)){sw.active=true;closeSwipes(sw.row);sw.row.style.transition='none'}else if(Math.abs(dy2)>8){sw=null;return}}
    if(sw&&sw.active){var x=Math.min(0,sw.base+dx2);if(x<-sw.w)x=-sw.w+(x+sw.w)*.3;sw.dx=dx2;sw.row.style.transform='translateX('+x+'px)'}
  }
  if(sd){sd.dy=Math.max(0,e.clientY-sd.y);if(sd.dy>4){sd.el.classList.add('dragging');sd.el.style.transform='translateY('+sd.dy+'px)'}}
});
function endPointer(){
  if(edge&&edge.active){
    var st=stacks[curTab],top=st[st.length-1].el,prev=st[st.length-2].el,fast=(edge.dx/(Date.now()-edge.t))>0.6;
    top.style.transition='';prev.style.transition='';
    if(edge.dx>edge.w*.33||fast)pop();else{top.style.transform='';prev.style.transform=''}
    suppressClick=true;setTimeout(function(){suppressClick=false},60);
  }
  edge=null;
  if(sw&&sw.active){
    var x=sw.base+sw.dx;sw.row.style.transition='';
    if(x<-sw.w/2){sw.row.style.transform='translateX('+(-sw.w)+'px)';sw.row.classList.add('open')}else{sw.row.style.transform='';sw.row.classList.remove('open')}
    suppressClick=true;setTimeout(function(){suppressClick=false},60);
  }
  sw=null;
  if(sd){var el=sd.el;el.classList.remove('dragging');if(sd.dy>110){closeSheet()}else el.style.transform='';sd=null}
}
app.addEventListener('pointerup',endPointer);
app.addEventListener('pointercancel',function(){
  if(edge&&edge.active){var st=stacks[curTab];[st[st.length-1].el,st[st.length-2].el].forEach(function(el){el.style.transition='';el.style.transform=''})}
  if(sw&&sw.active){sw.row.style.transition='';sw.row.style.transform=sw.base?'translateX('+sw.base+'px)':''}
  if(sd){sd.el.classList.remove('dragging');sd.el.style.transform=''}
  edge=null;sw=null;sd=null;
});

/* ================= boot ================= */
function clock(){var d=new Date(),el=$('#sb-time');if(el)el.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')}
loadLocal();
TABS.forEach(function(t){var entry={v:t};stacks[t]=[entry];$('.tabview[data-tab="'+t+'"]').appendChild(makePage(entry))});
buildTabbar();
$$('.tabview').forEach(function(v){v.classList.toggle('active',v.dataset.tab===curTab)});
render();
clock();setInterval(clock,30000);
connect(0);
window.__PR={S:S,calcScenario:calcScenario,trip:trip,computeShifts:computeShifts,tracker:tracker};
})();
</script>
</body>
